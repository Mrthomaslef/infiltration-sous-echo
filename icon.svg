<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1522"/>
      <stop offset="100%" stop-color="#13253A"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="64" y1="36" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.48"/>
      <stop offset="65%" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="probeGrad" x1="48" y1="10" x2="80" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="122" height="122" rx="25" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Ultrasound Fan / Linear Acoustic Beam -->
  <path d="M40 36 L88 36 L106 108 L22 108 Z" fill="url(#beamGrad)"/>
  <path d="M40 36 L22 108 M88 36 L106 108" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Echo Tissue Layers (Bursa / Tendon / Bone cortex) -->
  <path d="M28 74 Q64 64 100 74" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M26 84 Q64 73 102 84" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M24 98 Q64 88 104 98" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>

  <!-- Target Bursa / Effusion Zone -->
  <ellipse cx="66" cy="76" rx="16" ry="5.5" fill="#0284C7" fill-opacity="0.55" stroke="#38BDF8" stroke-width="1.8"/>

  <!-- In-Plane Infiltration Needle Entering From Left -->
  <line x1="14" y1="48" x2="65" y2="76" stroke="#FF5A36" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="20" y1="51.3" x2="65" y2="76" stroke="#FDE047" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round"/>
  <!-- Needle Hub -->
  <rect x="8" y="41" width="10" height="8" rx="2" transform="rotate(28.8 13 45)" fill="#FF5A36"/>

  <!-- Bright Hyperechoic Needle Tip (Tip Echo) -->
  <circle cx="66" cy="76" r="4.5" fill="#FF5A36"/>
  <circle cx="66" cy="76" r="2.2" fill="#FFFFFF"/>
  <circle cx="66" cy="76" r="9" stroke="#FF5A36" stroke-width="1.5" opacity="0.65"/>

  <!-- Linear High-Frequency Ultrasound Probe -->
  <path d="M54 10 H74 L78 24 H88 C90.2 24 92 25.8 92 28 V33 C92 35.2 90.2 37 88 37 H40 C37.8 37 36 35.2 36 33 V28 C36 25.8 37.8 24 40 24 H50 L54 10 Z" fill="url(#probeGrad)" stroke="#0F172A" stroke-width="2"/>
  <rect x="38" y="33" width="52" height="4" rx="1.5" fill="#0EA5E9"/>
  <circle cx="44" cy="29" r="2" fill="#FF5A36"/>

  <!-- Bottom SIMS · ÉCHO Badge -->
  <rect x="30" y="106" width="68" height="14" rx="5" fill="#09131F" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="64" y="116" text-anchor="middle" fill="#ECF3F9" font-family="monospace, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8">ÉCHO·SIMS</text>
</svg>
